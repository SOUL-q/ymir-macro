<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 600 80">
  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79B8FF"/>
      <stop offset="48%" stop-color="#718FEF"/>
      <stop offset="100%" stop-color="#D17BFF"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset dy="2" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.04 0 0 0 0 0.16 0 0 0 0.55 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="300" y="59" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="47" font-weight="700" letter-spacing="0.2"
        fill="url(#textGradient)" filter="url(#softShadow)">AVATAR OF YMIR</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="520" height="100" viewBox="0 0 520 100" role="img" aria-labelledby="title">
  <title id="title">GODFORGED</title>
  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9bd3ff"/>
      <stop offset="48%" stop-color="#789cf5"/>
      <stop offset="100%" stop-color="#c58aff"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-30%" width="120%" height="170%">
